name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: producao
    env:
      VERSAO: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSAO }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          IMAGEM: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGEM:$VERSAO" -t "$IMAGEM:latest" .
          docker push --all-tags "$IMAGEM"

      - name: Atualiza o container na EC2 (SSM, sem SSH)
        env:
          INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          comando=$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "deploy $VERSAO" \
            --parameters "commands=[\"/opt/barbearia/deploy.sh $VERSAO\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$comando" --instance-id "$INSTANCIA" || true
          aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
            --query StandardOutputContent --output text
          status=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
            --query Status --output text)
          echo "Status do deploy: $status"
          test "$status" = "Success"
