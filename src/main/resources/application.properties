spring.application.name=api

# Configuracoes de conexao com o Banco de Dados.
spring.datasource.url=jdbc:postgresql://localhost:5432/barbearia
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Mostra o SQL gerado
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Em producao, defina via variavel de ambiente (ex.: export API_SECURITY_TOKEN_SECRET=...)
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:troque-este-segredo-em-producao}
api.security.token.expiration-hours=2