spring.application.name=api

# Configuracoes de conexao com o Banco de Dados.
spring.datasource.url=jdbc:postgresql://localhost:5432/barbearia
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Mostra o SQL gerado (SHOW_SQL=true em dev)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Obrigatorio, minimo 32 bytes. Sem ele a aplicacao nao sobe.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:}
api.security.token.expiration-hours=2

# E-mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
api.mail.remetente=${MAIL_REMETENTE:nao-responda@barbearia.local}

# Redefinicao de senha
api.front.url=${FRONT_URL:http://localhost:5173}
api.senha.token-expiracao-minutos=30
api.senha.limpeza-cron=0 0 4 * * *

# Agenda (horarios no fuso da barbearia)
api.fuso-horario=America/Sao_Paulo
api.agenda.passo-minutos=15
api.agenda.antecedencia-maxima-dias=60

# Limite de requisicoes por IP nas rotas publicas
api.limite-ip.login.maximo=20
api.limite-ip.login.janela=1m
api.limite-ip.cadastro.maximo=10
api.limite-ip.cadastro.janela=1h
api.limite-ip.senha.maximo=5
api.limite-ip.senha.janela=15m

# Atras do CloudFront, o IP do cliente vem no X-Forwarded-For
api.proxy.confiavel=${PROXY_CONFIAVEL:false}
