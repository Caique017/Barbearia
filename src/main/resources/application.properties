spring.application.name=api

# Banco de dados (em producao tudo vem de variavel de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barbearia}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Mostra o SQL gerado (SHOW_SQL=true em dev)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Obrigatorio, minimo 32 bytes. Sem ele a aplicacao nao sobe.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:}
api.security.token.expiration-hours=2

# E-mail (dev: Mailpit sem autenticacao; producao: SMTP do Amazon SES com TLS)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
api.mail.remetente=${MAIL_REMETENTE:nao-responda@barbearia.local}

# Redefinicao de senha
api.front.url=${FRONT_URL:http://localhost:5173}
api.senha.token-expiracao-minutos=30
api.senha.limpeza-cron=0 0 4 * * *

# Agenda (horarios no fuso da barbearia)
api.fuso-horario=America/Sao_Paulo
api.agenda.passo-minutos=15
api.agenda.antecedencia-maxima-dias=60

# Assinatura do barbeiro (Stripe). Sem as chaves, o checkout responde 503
api.assinatura.dias-teste=7
api.assinatura.dias-pix=30
api.assinatura.preco-centavos=2999
api.stripe.chave-secreta=${STRIPE_SECRET_KEY:}
api.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
api.stripe.preco-cartao=${STRIPE_PRICE_ID:}

# Limite de requisicoes por IP nas rotas publicas
api.limite-ip.login.maximo=20
api.limite-ip.login.janela=1m
api.limite-ip.cadastro.maximo=10
api.limite-ip.cadastro.janela=1h
api.limite-ip.senha.maximo=5
api.limite-ip.senha.janela=15m

# Atras do CloudFront, o IP do cliente vem no X-Forwarded-For
api.proxy.confiavel=${PROXY_CONFIAVEL:false}

# Segredo que so o CloudFront conhece. Vazio = desligado (dev)
api.origem.segredo=${ORIGEM_SEGREDO:}

# Origens de outro dominio que podem chamar a API. Vazio = nenhuma (mesma origem via CloudFront)
api.cors.origens=${CORS_ORIGENS:}

# Actuator: so o health, sem detalhes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
